name: Publish Homebrew cask
description: Publish a verified stable release to the tap using a repository-scoped GitHub App token.
inputs:
  version:
    description: Stable release version without the v prefix.
    required: true
  sha256:
    description: Verified uploaded DMG SHA-256.
    required: true
  download-url:
    description: Verified uploaded DMG URL.
    required: true
  app-client-id:
    description: Homebrew publishing GitHub App Client ID.
    required: true
  app-private-key:
    description: Homebrew publishing GitHub App private key.
    required: true
  github-token:
    description: Token with read access to the source repository.
    required: true
runs:
  using: composite
  steps:
    - name: Test Homebrew publishing
      uses: ./.github/actions/test-homebrew

    - name: Create Homebrew tap installation token
      id: homebrew-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: codex-ecosystem
        repositories: homebrew-tap
        permission-contents: write

    - name: Prepare Homebrew cask
      id: prepare-homebrew
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        HOMEBREW_TAP_TOKEN: ${{ steps.homebrew-token.outputs.token }}
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_SHA256: ${{ inputs.sha256 }}
        RELEASE_DOWNLOAD_URL: ${{ inputs.download-url }}
      run: node "$ACTION_PATH/release.mts" prepare

    - name: Update Homebrew cask
      if: steps.prepare-homebrew.outputs.result == 'update'
      uses: mislav/bump-homebrew-formula-action@f865c8b0dbebd6e263cc06782a0e974c61cf12d2 # v4.2
      with:
        formula-name: codex-agent-bar
        formula-path: Casks/codex-agent-bar.rb
        homebrew-tap: codex-ecosystem/homebrew-tap
        push-to: codex-ecosystem/homebrew-tap
        tag-name: v${{ inputs.version }}
        download-url: ${{ inputs.download-url }}
        download-sha256: ${{ inputs.sha256 }}
        create-pullrequest: false
        create-branch: false
      env:
        COMMITTER_TOKEN: ${{ steps.homebrew-token.outputs.token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Verify publication and synchronize packaging
      if: steps.prepare-homebrew.outputs.result != 'newer-version'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        HOMEBREW_TAP_TOKEN: ${{ steps.homebrew-token.outputs.token }}
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_SHA256: ${{ inputs.sha256 }}
        RELEASE_DOWNLOAD_URL: ${{ inputs.download-url }}
      run: node "$ACTION_PATH/release.mts" finalize
