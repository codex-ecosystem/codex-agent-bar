name: Homebrew publishing checks

on:
  push:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/homebrew-checks.yml'
      - '.github/actions/**'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/homebrew-checks.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test Homebrew release automation
        uses: ./.github/actions/test-homebrew
