name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha256: ${{ steps.verify-release.outputs.sha256 }}
      download_url: ${{ steps.verify-release.outputs.download-url }}
    env:
      SPARKLE_PUBLIC_ED_KEY: "YBH74wFdhN0pdRj+e2NrVcUJ448H0C/O70uv5plgjXo="
      SPARKLE_PRIVATE_KEY: "efDHQvDteJeEgmw95eeqS3RbP6oy/XQBo632A4O5xag="
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Homebrew publishing credentials
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        env:
          HOMEBREW_APP_CLIENT_ID: ${{ secrets.HOMEBREW_APP_CLIENT_ID }}
          HOMEBREW_APP_PRIVATE_KEY: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$HOMEBREW_APP_CLIENT_ID" ] || [ -z "$HOMEBREW_APP_PRIVATE_KEY" ]; then
            echo "::error::HOMEBREW_APP_CLIENT_ID and HOMEBREW_APP_PRIVATE_KEY are required to publish stable releases to the Homebrew tap."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Build and verify DMG
        id: dmg
        uses: ./.github/actions/build-dmg
        with:
          version: ${{ steps.release.outputs.version }}
          sparkle-public-key: ${{ env.SPARKLE_PUBLIC_ED_KEY }}

      - name: Generate Sparkle appcast
        id: appcast
        uses: ./.github/actions/generate-appcast
        with:
          dmg-path: ${{ steps.dmg.outputs.path }}
          dmg-name: ${{ steps.dmg.outputs.name }}
          release-tag: ${{ steps.release.outputs.tag }}
          sparkle-private-key: ${{ env.SPARKLE_PRIVATE_KEY }}

      - name: Create GitHub Release
        run: npx --yes genereleaselog@latest --output false --assets "${{ steps.dmg.outputs.path }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release asset
        id: verify-release
        uses: ./.github/actions/verify-release-asset
        with:
          dmg-path: ${{ steps.dmg.outputs.path }}
          dmg-name: ${{ steps.dmg.outputs.name }}
          release-tag: ${{ steps.release.outputs.tag }}
          github-token: ${{ github.token }}

      - name: Publish Sparkle appcast
        uses: ./.github/actions/publish-appcast
        with:
          appcast-path: ${{ steps.appcast.outputs.path }}
          release-tag: ${{ steps.release.outputs.tag }}

  homebrew:
    name: Publish Homebrew cask
    needs: release
    if: ${{ !contains(needs.release.outputs.version, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish Homebrew cask
        uses: ./.github/actions/publish-homebrew
        with:
          version: ${{ needs.release.outputs.version }}
          sha256: ${{ needs.release.outputs.sha256 }}
          download-url: ${{ needs.release.outputs.download_url }}
          app-client-id: ${{ secrets.HOMEBREW_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          github-token: ${{ github.token }}
